<section class="container-component">
    <div class="card">
        <h3>Consultando orden <strong class="txt-info">{{order}}</strong></h3>

        <div class="td-container-tag" *ngIf="estado == 'Pendiente' || estado == 'Credito'">
            <div class="td-tag">{{estado}}</div>
            <i class="fa-brands fa-product-hunt txt-info"></i>
        </div>
        <div class="td-container-tag" *ngIf="estado == 'Anulada'">
            <div class="td-tag">{{estado}}</div>
            <i class="fa-solid fa-circle-xmark txt-danger"></i>
        </div>
        <div class="td-container-tag" *ngIf="estado == 'Pagada'">
            <div class="td-tag">{{estado}}</div>
            <i class="fa-solid fa-circle-check txt-success"></i>
        </div>

        <div class="container-table">
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of ListOrder; let i = index">
                        <td>{{item.producto}}</td>
                        <td>${{getConverPrice(item.precio).toLocaleString()}}</td>
                        <td>{{item.cantidad}}</td>
                        <td>${{ (item.precio * item.cantidad).toLocaleString() }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="container-btn">
            <div class="col1-btn">
                <button type="button" class="btn btn-default rd-4" (click)="cancel()">Volver</button>
            </div>
            <div class="col2-btn">
                <button (click)="getNullOrder()" *ngIf="ListOrder[0]?.estado == 'Pendiente' || ListOrder[0]?.estado == 'Credito'" type="button" class="btn btn-default rd-4 btn-pay">
                    Anular
                </button>
                <button (click)="getNullOrder()" *ngIf="ListOrder[0]?.estado == 'Pendiente' || ListOrder[0]?.estado == 'Credito'" type="button" class="btn btn-default rd-4 btn-pay">
                    Editar
                </button>
                <button (click)="getPayOrder(ListOrder[0]?.codigo)" *ngIf="ListOrder[0]?.estado == 'Pendiente' || ListOrder[0]?.estado == 'Credito'" type="button" class="btn btn-success rd-4 btn-pay">
                    Pagar
                </button>
            </div>
        </div>
    </div>
</section>

<section class="modal-description" *ngIf="modal">
    <div class="modal-card rd-2">
        <div class="modal-header">
            <h1><i class="fa-solid fa-circle-xmark txt-danger"></i></h1>
            <h3>¿Por qué motivo desea anular la orden?</h3>
        </div>
        <div class="modal-body">
            <textarea placeholder="Motivo de anulación" id="input_description"></textarea>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-default rd-4" (click)="cancelModalOrder()">Volver</button>
            <button type="button" class="btn btn-success rd-4" (click)="okModalOrder()">Anular</button>
        </div>
    </div>
</section>
