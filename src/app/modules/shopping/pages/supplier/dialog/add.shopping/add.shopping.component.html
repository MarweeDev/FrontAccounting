<section class="container-component">
  <div class="card">
    <div class="supplier-header">
      <div class="supplier-icon">
        <i class="fa-solid fa-truck-field"></i>
      </div>
      <div>
        <h3>Nuevo proveedor</h3>
        <p>Registra la información básica para usarlo en compras.</p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="add()">
      <label for="proveedor">
        <input type="text" id="proveedor" formControlName="Proveedor" placeholder="Proveedor">
        <div class="error-message" *ngIf="form.get('Proveedor')?.hasError('required') && form.get('Proveedor')?.touched">
          Requerido
        </div>
      </label>

      <label for="nit">
        <input type="text" id="nit" formControlName="Nit" placeholder="NIT">
        <div class="error-message" *ngIf="form.get('Nit')?.hasError('required') && form.get('Nit')?.touched">
          Requerido
        </div>
      </label>

      <label for="contacto">
        <input type="text" id="contacto" formControlName="Contacto" placeholder="Contacto">
        <div class="error-message" *ngIf="form.get('Contacto')?.hasError('required') && form.get('Contacto')?.touched">
          Requerido
        </div>
      </label>

      <label for="descripcion">
        <input type="text" id="descripcion" formControlName="Descripcion" placeholder="Descripción">
        <div class="error-message" *ngIf="form.get('Descripcion')?.hasError('required') && form.get('Descripcion')?.touched">
          Requerido
        </div>
      </label>

      <div class="container-btn">
        <button type="button" class="btn btn-default rd-4" (click)="cancel()">Cancelar</button>
        <button type="submit" class="btn btn-success m-2 rd-4">Crear proveedor</button>
      </div>
    </form>
  </div>
</section>
