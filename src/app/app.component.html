<app-breadcrumbs id="nav"></app-breadcrumbs>

<div class="aside-overlay" *ngIf="statusDisabledMain" (click)="OnHiddenBar()"></div>
<app-mainlayout *ngIf="statusDisabledMain" (click)="$event.stopPropagation()"></app-mainlayout>

<div class="content" id="content">
    <router-outlet></router-outlet>
</div>

<section class="branding-toast" *ngIf="brandingToastVisible">
    <div class="branding-toast-card">
        <button type="button" class="branding-toast-close" (click)="closeBrandingToast()" [disabled]="brandingCaptureBusy">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="branding-toast-head">
            <span><i class="fa-solid fa-camera-retro"></i></span>
            <div>
                <strong>Captura para branding</strong>
                <small>Brief visual local, sin backend</small>
            </div>
        </div>
        <label>
            Notas para diseno
            <textarea rows="4" name="globalBrandingNotes" [(ngModel)]="brandingBrief.notes" (ngModelChange)="persistBrandingBrief()" placeholder="Ej: revisar header, aside, colores, jerarquia visual..."></textarea>
        </label>
        <div class="branding-toast-summary">
            <span>{{brandingBrief.product}}</span>
            <small>{{brandingBrief.audience}}</small>
        </div>
        <div class="branding-toast-actions">
            <button type="button" class="btn btn-default rd-4" (click)="copyBrandingBrief()">
                <i class="fa-solid fa-copy"></i>
                Copiar brief
            </button>
            <button type="button" class="btn btn-success rd-4" (click)="captureProductScreenshot()" [disabled]="brandingCaptureBusy">
                <i class="fa-solid fa-camera"></i>
                {{brandingCaptureBusy ? 'Capturando...' : 'Tomar screenshot'}}
            </button>
        </div>
    </div>
</section>

<section
    class="season-effect-overlay"
    *ngIf="visualEffect$ | async as visualEffect"
    [class.active]="visualEffect !== 'none'"
    [class.snow-effect]="visualEffect === 'christmas'"
    [class.shadow-effect]="visualEffect === 'halloween'"
    aria-hidden="true">
    <ng-container *ngIf="visualEffect === 'christmas'">
        <span
            class="snow-particle"
            *ngFor="let item of snowParticles"
            [style.--x]="item.x"
            [style.--delay]="item.delay"
            [style.--duration]="item.duration"
            [style.--size]="item.size"
            [style.--drift]="item.drift"
            [style.--opacity]="item.opacity"></span>
    </ng-container>
    <ng-container *ngIf="visualEffect === 'halloween'">
        <span
            class="shadow-particle"
            *ngFor="let item of shadowParticles"
            [style.--top]="item.top"
            [style.--delay]="item.delay"
            [style.--duration]="item.duration"
            [style.--scale]="item.scale"
            [style.--opacity]="item.opacity"></span>
    </ng-container>
</section>
