<app-breadcrumbs id="nav"></app-breadcrumbs>

<div class="aside-overlay" *ngIf="statusDisabledMain" (click)="OnHiddenBar()"></div>
<app-mainlayout *ngIf="statusDisabledMain" (click)="$event.stopPropagation()"></app-mainlayout>

<div class="content" id="content">
    <router-outlet></router-outlet>
</div>

<section class="container-loader-module" *ngIf="statusLoaderModule">
    <div class="container-loader-margin">
        <div class="custom-loader"></div>
        <p class="info">Cargando componentes</p>
    </div>
</section>

<section class="container-loader-component" *ngIf="statusLoaderComponent">
    <div class="container-loader-margin">
        <div class="custom-loader"></div>
    </div>
</section>
