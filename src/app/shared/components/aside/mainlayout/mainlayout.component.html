<section class="shell animated fadeInTopLeft" id="slider_left">
    <div class="command-center">
        <div class="brand-zone">
            <div class="brand-mark">
                <img *ngIf="imagenBase64" [src]="imagenBase64" alt="logo compania">
                <span *ngIf="!imagenBase64">{{getInitials(user)}}</span>
            </div>
            <div class="brand-copy">
                <small>{{companyName}}</small>
                <strong>Centro de operacion</strong>
            </div>
        </div>

        <nav class="module-dock" aria-label="Modulos principales">
            <button
                type="button"
                class="module-button"
                *ngFor="let item of ListModule"
                [id]="'nav_left_' + item.id_modulo"
                [class.active]="item.id_modulo === activeButtonId"
                (click)="OnRouterModule(item.ruta, item.id_modulo)"
                [title]="item.modulo">
                <span class="module-icon">
                    <i [className]="item.icono"></i>
                </span>
                <span class="module-copy">
                    <strong>{{item.modulo}}</strong>
                    <small>{{getModuleKind(item)}}</small>
                </span>
                <span class="module-indicator" *ngIf="isReportsModule(item)">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    IA
                </span>
            </button>
        </nav>

        <div class="footer-zone">
            <div class="shift-widget" *ngIf="showShiftWidget">
                <strong>{{getShiftTitle()}}</strong>
                <small *ngIf="currentShift?.status === 'open'">Base {{currentShift?.opening_amount | currency}}</small>
                <div *ngIf="currentShift?.status !== 'open'; else closeShiftTpl">
                    <input type="number" [(ngModel)]="openingAmount" [placeholder]="getOpeningPlaceholder()">
                    <button type="button" [title]="businessProfile === 'instituciones' ? 'Abrir jornada' : 'Abrir caja'" (click)="openShift()">
                        <i class="fa-solid fa-play"></i>
                    </button>
                </div>
                <ng-template #closeShiftTpl>
                    <div>
                        <input type="number" [(ngModel)]="countedCash" [placeholder]="getClosingPlaceholder()">
                        <button type="button" [title]="businessProfile === 'instituciones' ? 'Cerrar jornada' : 'Cerrar caja'" (click)="closeShift()">
                            <i class="fa-solid fa-lock"></i>
                        </button>
                    </div>
                </ng-template>
            </div>
            <button type="button" class="utility-button" title="Configuracion" (click)="OnRouterModule('settings/dashboard', 0)">
                <i class="fa-solid fa-sliders"></i>
                <span>Preferencias</span>
            </button>
            <button type="button" class="utility-button exit" title="Salir" (click)="OnRouterModule('login', 0)">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Salir</span>
            </button>
        </div>
    </div>
</section>
